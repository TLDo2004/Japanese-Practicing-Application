// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

/**
 * Windows CMake links sometimes omit libc++ (undefined operator delete / std::__ndk1::*).
 * Force ANDROID_STL=c++_shared for every Android module that uses CMake.
 */
subprojects { sub ->
  sub.afterEvaluate {
    def androidExt = sub.extensions.findByName("android")
    if (androidExt == null) return
    try {
      androidExt.defaultConfig.externalNativeBuild.cmake.arguments(
        "-DANDROID_STL=c++_shared",
        "-DCMAKE_CXX_STANDARD=20",
        "-DCMAKE_SHARED_LINKER_FLAGS=-lc++_shared -lc++abi"
      )
    } catch (Exception ignored) {
      // Module has no cmake externalNativeBuild — ignore.
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
